function nav(){ $('#nav').innerHTML=`<button data-route="overview" class="${route==='overview'?'active':''}">知识库概览</button><button data-route="components" class="${route.startsWith('component')?'active':''}">基础组件 <span class="count">${KB.components.length}</span></button><div class="subnav">${['基础','导航','输入','数据展示','反馈'].map(g=>`<button data-route="components:${g}">${g}</button>`).join('')}</div><div class="navtitle">页面组织模式 / 8</div>${KB.patterns.map(p=>`<button data-route="pattern:${p.id}" class="${route==='pattern:'+p.id?'active':''}">${p.name}</button>`).join('')}<div class="navtitle">生成约束</div><button data-route="rules" class="${route==='rules'?'active':''}">通用设计规则</button><button data-route="contract" class="${route==='contract'?'active':''}">SPEC 输出契约</button><button data-route="sources" class="${route==='sources'?'active':''}">来源与版本边界</button>`;}
function patternCards(ps){return ps.map(p=>`<button class="card" data-route="pattern:${p.id}"><div class="symbol">${icons[KB.patterns.indexOf(p)]}</div><h3>${p.name}</h3><p>${p.goal}</p><p class="small">${p.variants.length} 种结构变体 · 可组合</p></button>`).join('')}
function compCards(cs){return cs.map(c=>`<button class="card" data-route="component:${c.id}"><span class="label gray">${c.category}</span><h3 style="margin-top:14px">${c.id} <span class="small">${c.name}</span></h3><p>${c.description}</p></button>`).join('')}
function overview(){return `<span class="label">REVIEW DRAFT · v${KB.version}</span><h1>让组件成为设计决策</h1><p class="lead">以 TDesign 为基础约束，将组件选择、页面组织和交互原则整理为可浏览、可导出的设计知识。服务于“用户提示词 → UI / 交互设计文档”。</p><div class="note">八类是可组合的组织模式，不是穷尽所有小程序的分类。先判断用户任务，再选择页面结构；组件按需要出现。</div><div class="grid"><div class="panel"><span class="stat">${KB.components.length}</span><h3>基础组件</h3><p class="small">官方目录映射与使用意图</p></div><div class="panel"><span class="stat">8 / 24</span><h3>组织模式 / 布局变体</h3><p class="small">项目定义的页面决策规则</p></div><div class="panel"><span class="stat">8</span><h3>通用约束</h3><p class="small">导航、状态、主题与实现边界</p></div></div><h2>页面组织模式</h2><div class="grid">${patternCards(KB.patterns)}</div><h2>怎样组合</h2><div class="panel"><h3>场馆预约小程序</h3><p>找场馆：目录选取型；填写预约：流程办理型；预约管理：工作管理型；在线咨询：对话协作型。</p><p class="small">模式可以在页面间切换，也可在同一页面以主模式 + 辅助区域组合。每次组合需要说明任务关系，避免机械叠加全部模块。</p></div>`}

const cap=(t,c)=>`${t}<small class="mcaption">${c}</small>`,card=t=>`<div class="mcard">${t}</div>`,button=t=>`<div class="mbtn">${t}<small class="mcaption" style="color:#cbdfff">Button</small></div>`,field=t=>`<div class="mfield">${t}<small class="mcaption">Input</small></div>`,tag=t=>`<span class="mchip">${t}</span>`,row=(a,b)=>`<div class="mrow"><span>${a}</span><span>${b}</span></div>`,photo=(t,alt='',h=100)=>`<div class="mphoto ${alt}" style="height:${h}px">${t}</div>`,bar=n=>`<div class="bar"><i style="width:${n}%"></i></div>`,nav=t=>`<div class="mnav"><span>‹　${t}</span><span>···</span></div>`,foot=t=>`<div class="mfoot">${t}</div>`,tabs=ts=>`<div class="mtabs">${ts.map((t,j)=>j?`<span>${t}</span>`:`<b>${t}</b>`).join('')}</div>`,body=t=>`<div class="mbody">${t}</div>`;
let h='',title='',tone='',explain='';
if(p.id==='tool'){
 title=['长度换算','图片压缩','文字识别结果'][i];
 if(i===0){h=body(card(cap('输入长度','Input + Picker')+field('100　厘米')+row('目标单位',tag('米')))+`<div style="text-align:center;padding:15px;color:#8192ab">换算结果</div>`+card(`<div style="text-align:center"><div class="mmetric">1.00 <small>米</small></div><p class="mmuted">输入变化后即时更新</p></div>`));explain='输入与结果对照排列，不设执行按钮；结果在视线中心，适合低成本即时计算。'}
 if(i===1){h=body(`<div class="mupload">＋<p>选择一张图片</p><small class="mcaption">Upload</small></div>`+card(`<p>压缩质量 ${tag('80%')}</p>${bar(80)}<small class="mcaption">Slider</small>`)+button('开始压缩')+`<p class="mmuted">处理成功后在下方展开结果与保存操作。</p>`);explain='上传区承担主要输入，参数与主操作紧邻；结果执行后才出现，避免未操作时堆放空结果卡。'}
 if(i===2){h=`<div class="manchor">输入页 → 处理完成 → 当前结果页</div>`+body(row('识别文本',tag('可编辑'))+`<div class="mcard" style="min-height:310px;line-height:2;margin-top:12px">城市的魅力，往往藏在日常生活的细节里。<br><br>沿着熟悉的街道慢慢走，看见建筑与树影之间的变化。<small class="mcaption">业务结果块 / Textarea</small></div>`)+foot(`<div class="mcols">${button('复制文本')}${button('导出')}</div>`);explain='输入与结果分为两页；当前页把大面积留给结果编辑，固定底部承载结果操作。'}
}
if(p.id==='flow'){
 title=['场馆预约','办理 · 联系信息','企业入驻进度'][i];
 if(i===0){h=body(card(cap('预约信息','Form')+field('服务：场馆参观')+field('日期：请选择')+field('时段：请选择'))+card(cap('联系人','Form')+field('姓名')+field('联系电话'))+button('确认预约'));explain='单页按信息组排列，无步骤条；提交跟随表单，适合短任务。'}
 if(i===1){h=`<div class="msteprail"><span class="on"></span><span class="on"></span><span></span></div><div style="padding:0 16px 12px;background:white">${cap('2 / 3　联系信息','Steps')}</div>`+body(`<h3>谁将参加本次活动？</h3><p class="mmuted">信息仅用于本次预约联系。</p>`+card(field('联系人姓名')+field('联系电话')))+foot(row('上一步',`<span style="width:65%">${button('下一步')}</span>`));explain='阶段导航固定在上方，正文只呈现当前阶段，前进与返回放在底部稳定位置。'}
 if(i===2){h=body(card(row('入驻申请',tag('进行中'))+bar(40))+`<div style="border-left:2px solid #d7e2f2;margin-left:12px;padding-left:20px"><div class="mitem">✓　账号验证${tag('已完成')}</div><div class="mitem"><b>●　企业资料</b>${tag('待完善')}${card(field('企业名称')+'<div class="mupload">＋ 营业执照<br><small class="mcaption">Upload</small></div>'+button('继续填写'))}</div><div class="mitem">○　审核开通<p class="mmuted">提交资料后开始</p></div></div>`);explain='总览和阶段清单并存，当前任务在清单中展开，允许暂停后恢复；并非强制一页一步。'}
}
if(p.id==='catalog'){
 title=['选择场馆','好物精选','咖啡点单'][i];const product=(n,price,alt='')=>card(photo('◒',alt)+`<b>${n}</b><p class="mmuted">${price}</p>`);
 if(i===0){h=body(field('⌕ 搜索场馆')+row(tag('距离优先')+tag('可预约'),'筛选')+['城市艺术中心','滨江展览馆','社区文化空间'].map((n,j)=>card(`<div class="mrow mcatalog-row" style="align-items:flex-start"><div style="width:76px;flex-shrink:0">${photo('◒',j?'alt':'',76)}</div><div><b>${n}</b><p class="mmuted">距离 ${j+1}.2 km · 今日可约</p>${tag('查看时段')}</div></div>`)).join(''));explain='列表行强调名称、距离和可用信息，适合比较文字属性；不是双列商品卡。'}
 if(i===1){h=body(field('⌕ 搜索商品')+row(tag('推荐')+tag('新品'),'筛选')+`<div class="mcols" style="margin-top:12px">${product('随行咖啡杯','¥59')}${product('手冲滤杯','¥89','alt')}${product('咖啡豆礼盒','¥128','alt')}${product('玻璃分享壶','¥79')}</div>`);explain='搜索与筛选在顶部，对象以等宽双列排列；图片、名称和价格按统一顺序便于扫视比较。'}
 if(i===2){h=`<div style="display:flex;flex:1;min-height:0"><div class="mside"><div class="sel">人气推荐</div><div>咖啡</div><div>茶饮</div><div>小食</div><small class="mcaption">SideBar</small></div><div class="mbody">${['燕麦拿铁','冷萃咖啡','抹茶拿铁'].map((n,j)=>card(photo('◒',j?'alt':'',65)+row(n,tag('＋'))+'<p class="mmuted">¥28 起 · 规格可选</p>')).join('')}</div></div>`+foot(row('已选 2 件 · ¥56',button('去结算')));explain='侧边分类与商品列表并列滚动，底部保留已选摘要；这里的分类是 SideBar，商品行是业务组合。'}
}
if(p.id==='content'){
 title=['城市观察','发现灵感','专题 · 街区更新'][i];
 if(i===0){h=tabs(['推荐','建筑','生活'])+body(`<div class="mhero">用一个下午，认识一座城</div><p class="mmuted">城市观察 · 8 分钟阅读</p>`+['街角的新生活','老建筑的另一种可能'].map((n,j)=>`<div class="mitem mrow"><div><b>${n}</b><p class="mmuted">从日常细节出发</p></div><div style="width:85px">${photo('◒',j?'alt':'',75)}</div></div>`).join(''));explain='单列阅读流采用首篇主视觉加图文条目，内容自然向下延伸，强调标题与阅读顺序。'}
 if(i===1){h=tabs(['全部','空间','展览'])+body(`<div class="mfeed"><div>${card(photo('◒','',150)+'<p>街角咖啡馆的绿色日常</p><small class="mmuted">Lili · 236 收藏</small>')}${card(photo('◒','alt',90)+'<p>新的城市散步路线</p>')}</div><div>${card(photo('◒','alt',95)+'<p>周末的三场展览</p>')}${card(photo('◒','',160)+'<p>看见建筑中的光</p>')}</div></div>`);explain='图片优先的错落双列发现流，不同内容高度形成视觉节奏；瀑布流需业务布局，不把 Grid 宫格直接当实现。'}
 if(i===2){h=body(`<p class="mmuted">专题 / 城市与日常</p><h2 style="font-size:26px;margin:10px 0">街区如何重新生长</h2><p>从微小的空间变化，看见日常生活的更新。</p><div class="manchor">导读　·　街道　·　公共空间</div><div class="mhero" style="height:120px;margin-top:14px">街道与人</div><h3 style="margin-top:15px">在熟悉的地方发现新可能</h3><p>空间的变化，发生在人们每天经过的街角。</p><p>本专题将沿着街道、店铺与公共空间展开。</p>`);explain='长文专题采用单篇连续叙事与章节导航，不套信息流卡片；按需吸顶章节入口。'}
}
if(p.id==='immersive'){
 title=['山间声音','全屏作品','呼吸练习'][i];tone='mimmersive';
 if(i===0){h=`<div class="mbody"><div style="flex:1;display:grid;place-items:center;font-size:60px;color:#d7eeed">◉</div><h2 style="margin:8px 0">山间声音</h2><p style="color:#bdd5df">10 分钟专注聆听</p><div class="mcontrol">${row('03:24','10:00')}${bar(34)}<div style="text-align:center;font-size:28px">↶　Ⅱ　↷</div><small class="mcaption">Slider + Button / 平台 audio</small></div></div>`;explain='内容主体占全屏，标题与播放控制叠在底部；不再沿页面堆叠“媒体卡、控制卡、状态卡”。'}
 if(i===1){h=`<div class="mbody" style="padding:0;justify-content:center"><div style="background:linear-gradient(40deg,#4e6b78,#b0baac,#375967);height:100%;display:grid;place-items:center"><div style="border:1px solid #e2e8dd66;width:65%;height:65%;transform:rotate(-10deg);display:grid;place-items:center;font-size:48px">◒</div></div><div style="position:absolute;bottom:20px;left:18px;right:18px">${row('01 / 06',tag('作品说明'))}<small class="mcaption">Image / ImageViewer</small></div></div>`;explain='图片成为整个观看区域，页码与说明入口为轻量覆盖，不引入无关操作栏。'}
 if(i===2){h=`<div class="mbody" style="justify-content:center;text-align:center"><p style="letter-spacing:4px">缓 慢 吸 气</p><div class="morb"></div><p>第 4 轮 / 共 8 轮</p>${bar(50)}<div style="margin-top:35px">${row('退出练习',tag('暂停'))}</div><small class="mcaption">业务动画 + Progress + Button</small></div>`;explain='中心互动主体组织注意力，指令在上、进度与控制在下；动画与计时是独立业务能力。'}
}
if(p.id==='work'){
 title=['我的任务','经营概览','工作空间'][i];
 if(i===0){h=body(row('<h3>今日待办 5</h3>',tag('＋ 新建'))+tabs(['全部','今天','本周'])+`<p class="mmuted">优先处理</p>`+['审核设计方案','确认项目排期','更新组件规范','整理本周总结'].map((n,j)=>card(row('○　'+n,tag(j?'P2':'P1'))+'<p class="mmuted">项目 A · 今日 18:00</p>')).join(''));explain='待办清单直接占据主区域，筛选与新建靠近任务；不强行加入指标卡与功能宫格。'}
 if(i===1){h=body(row('本周经营数据',tag('本周'))+`<div class="mcols" style="margin-top:12px">${card('成交额<div class="mmetric">28.6k</div><small class="mmuted">较上周 +12%</small>')}${card('待处理<div class="mmetric">08</div><small class="mmuted">其中 3 项异常</small>')}</div>`+card('<b>成交趋势</b><div style="display:flex;align-items:end;height:90px;gap:10px;margin-top:16px">'+[40,65,48,80,70,95].map(n=>`<div style="flex:1;height:${n}%;background:#bfd3f7;border-radius:4px 4px 0 0"></div>`).join('')+'</div><small class="mcaption">业务图表，非基础组件</small>')+card(row('异常订单',tag('3'))+'<div class="mitem">订单 A · 待确认</div><div class="mitem">订单 B · 待退款</div>'));explain='指标与趋势占上方，异常清单承接行动；数据模块和图表明确为业务组合。'}
 if(i===2){h=body(`<h3>上午好，团队</h3><p class="mmuted">快速进入常用工作</p><div class="manchor">有 3 条待处理通知</div><div class="mcols" style="margin:15px 0">${['＋ 创建任务','▦ 项目管理','◉ 团队成员','▤ 工作文档'].map(n=>card(n)).join('')}</div><small class="mcaption">Grid · 功能入口</small><h3 style="margin-top:20px">最近访问</h3>`+card('<div class="mitem">设计系统建设</div><div class="mitem">AI 搜索体验优化</div><div class="mitem">本周团队计划</div>'));explain='稳定功能入口优先，最近访问辅助回到工作；没有必要时省略指标区。'}
}
if(p.id==='chat'){
 tone='mchat';title=['旅行助手','学习规划助手','任务协作'][i];let msgs=`<div class="mspeech user">帮我安排一个周末计划。</div><div class="mspeech">你更喜欢散步，还是徒步？</div>`;
 if(i===0){h=body(msgs+`<div class="mspeech user">想去附近徒步。</div><div class="mspeech">好，我按交通、难度和时长帮你筛选。</div>${tag('公共交通')}${tag('轻松路线')}`)+`<div class="mchatinput"><div class="mfield">继续提问…</div><div class="mbtn" aria-label="发送">↑</div></div>`;explain='用户与助手消息分侧排列，输入区停靠底部，消息区独立滚动；不是内容卡片的纵向列表。'}
 if(i===1){h=body(`<div class="mspeech user">帮我安排明天的学习。</div><div class="mspeech">建议从这三个任务开始：</div>`+card('<b>明日学习计划</b><div class="mitem">阅读　20 分钟</div><div class="mitem">口语　15 分钟</div><div class="mitem">复习　10 分钟</div>'+button('确认添加'))+`<div class="mspeech">你也可以继续调整时长。</div>`)+`<div class="mchatinput"><div class="mfield">调整计划…</div><div class="mbtn" aria-label="发送">↑</div></div>`;explain='对话中插入结构化任务卡，确认按钮属于该任务；消息输入与任务执行入口分开。'}
 if(i===2){h=tabs(['任务视图','对话'])+body(`<div class="manchor">已根据最近对话同步计划</div><h3 style="margin-top:20px">明日计划</h3>`+card(field('计划名称：英语学习')+'<div class="mitem">阅读　20 分钟</div><div class="mitem">口语　15 分钟</div>'+button('保存调整'))+'<p class="mmuted">切回对话可继续协商；两个视图共享任务状态。</p>');explain='对话与工作结果使用切换视图；当前展示任务编辑界面，不把所有表单塞进消息气泡。'}
}
if(p.id==='goal'){
 title=['今日习惯','成长记录','单词挑战'][i];
 if(i===0){h=body(card(row('今日目标',tag('2 / 3'))+bar(67)+'<p class="mmuted">再完成一项即可达成今日目标</p>')+['喝水 8 杯','阅读 15 分钟','运动 20 分钟'].map((n,j)=>card(row((j<2?'✓　':'○　')+n,tag(j<2?'已完成':'去完成')))).join('')+`<div style="text-align:center;padding:12px;color:#7f8fa7;font-size:12px">✦ 完成今日目标，获得 30 积分</div>`);explain='目标摘要与可完成任务形成闭环，反馈紧贴任务；不需要虚构关卡地图。'}
 if(i===1){h=body(`<div style="text-align:center;padding:15px"><div style="font-size:44px">✦</div><div class="mmetric">连续 12 天</div><p class="mmuted">已累计完成 38 次练习</p></div>`+card('<b>本月记录</b><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:15px 0">'+Array.from({length:21},(_,j)=>`<span style="background:${j<12?'#0052d9':'#e7edf5'};height:20px;border-radius:4px"></span>`).join('')+'</div><small class="mcaption">业务记录视图 / Calendar 可选</small>')+card('已解锁成就　✦　✦　◇'))+foot(button('继续今天的练习'));explain='长期趋势和历史记录占主体，当前行动固定在底部；奖励展示是业务模块，不映射成 Badge 提示徽标。'}
 if(i===2){h=body(row('基础词汇 · 第 1 章',tag('3 / 8'))+`<div class="mtrack" style="margin-top:20px"><div class="mlevel done" style="margin-left:-80px">✓</div><div class="mconnector"></div><div class="mlevel done" style="margin-left:40px">✓</div><div class="mconnector"></div><div class="mlevel current" style="margin-left:-20px">03</div><div class="mconnector"></div><div class="mlevel" style="margin-left:80px">04</div><div class="mconnector"></div><div class="mlevel" style="margin-left:0">05</div></div><small class="mcaption">业务关卡路径 · 非 Steps 默认样式</small>`)+foot(button('开始当前挑战'));explain='关卡以空间路径表达成长与解锁，当前节点突出；路径是业务绘制，不能仅以 Progress 或 Steps 代替。'}
}
h=h.replace(/<small class="mcaption"[^>]*>[\s\S]*?<\/small>/g,'');
return `<div class="preview layout-stage"><div class="mock ${tone}">${nav(title)}${h}</div></div><div class="preview-key"><span>页面布局示例</span><span>组件映射见下方</span><span>内容可滚动</span></div><div class="layout-explain"><b>这个布局为什么不同</b><br>${explain}</div>`;
}

function pattern(p){let v=p.variants[variant];return `<div class="crumb">页面组织模式 / 原${p.previous_name}</div><span class="label">项目设计规则</span><h1>${p.name}</h1><p class="lead">${p.principle}</p><div class="split"><div><h2>布局与组合</h2><select id="variant" aria-label="选择布局变体">${p.variants.map((v,i)=>`<option value="${i}" ${i===variant?'selected':''}>${v.name}</option>`).join('')}</select><p class="small">选择条件：${v.when}</p><div class="tabs" role="tablist">${['preview','rules','json'].map((t,i)=>`<button role="tab" aria-selected="${tab===t}" data-tab="${t}" class="${tab===t?'active':''}">${['结构预览','组合规则','结构 JSON'][i]}</button>`).join('')}</div>${tab==='preview'?`${layoutPreview(p,variant)}<p class="small">页面布局示例：展示区域比例、并列关系和操作位置；为 HTML 模拟，不是真实 TDesign 小程序运行结果。</p>`:tab==='rules'?`<div class="panel"><ul>${p.rules.map(r=>`<li>${r}</li>`).join('')}</ul></div>`:`<pre>${esc(JSON.stringify({pattern:p.id,variant:v,components:p.components,rules:p.rules},null,2))}</pre>`}<h2>组件映射</h2><div class="chips">${p.components.map(c=>`<button data-route="component:${c}">${c}</button>`).join('')}</div><div class="note"><b>组合 / 平台边界</b><br>${p.extension}</div><h2>检查清单</h2><div class="panel">${p.checks.map((c,i)=>`<label class="demo-row"><span>${c}</span><input class="checks" type="checkbox" aria-label="${esc(c)}"></label>`).join('')}<p class="small">勾选仅用于本次审阅，不代表自动检测通过。</p></div></div><div><div class="panel"><h3>什么时候选</h3><p>${p.select_when}</p><div class="kv"><b>用户目标</b><p class="small">${p.goal}</p></div><div class="kv"><b>如何与其他模式组合</b>${p.combine.map(c=>`<p class="small">${c}</p>`).join('')}</div><div class="kv"><b>不是固定模板</b><p class="small">不强制 Navbar、TabBar、步骤条、卡片或固定底栏。按信息架构与实际任务决定。</p></div><button class="btn" id="download-pattern">导出本模式 JSON</button></div></div></div>`}
function demo(c){let n=c.id;if(n==='Button')return '<button data-demo="done">确认操作</button> <button class="secondary" data-demo="cancel">次要操作</button>';if(['Input','Search','Textarea','Form'].includes(n))return `<label>请输入${c.name}<input placeholder="输入内容，查看交互示意" aria-label="${c.name}"></label>`;if(['Slider','Progress','Stepper','Rate','CountDown'].includes(n))return '<label>调整数值 <input id="range" type="range" min="0" max="100" value="60"></label><strong id="range-value">60</strong><div class="bar"><i id="range-bar" style="width:60%"></i></div>';if(['Switch','Checkbox','Radio'].includes(n))return `<label><input type="${n==='Radio'?'radio':'checkbox'}" style="width:auto"> ${c.name}示意</label>`;if(['Tabs','Segmented','SideBar','TabBar'].includes(n))return '<div class="chips"><button data-demo="first">第一个视图</button><button data-demo="second">第二个视图</button></div><p id="demo-status">当前：第一个视图</p>';if(n==='Upload')return '<label>选择本地图片（仅本地，不上传）<input type="file" accept="image/*" id="local-file"></label><p id="file-status" class="small">尚未选择文件</p>';if(['Loading','Skeleton'].includes(n))return '<div style="height:18px;background:#e7edf7;border-radius:5px;width:85%;margin:12px 0"></div><div style="height:18px;background:#edf2f9;border-radius:5px;width:65%"></div><p class="small">加载占位示意</p>';if(['Toast','Dialog','Popup','ActionSheet','Message'].includes(n))return `<button data-demo="feedback">查看${c.name}反馈示意</button>`;if(n==='Tag'||n==='Badge')return '<span class="label">进行中</span> <span class="label gray">待处理</span>';if(n==='Empty'||n==='Result')return '<h3>暂无内容</h3><p class="small">尝试调整筛选或创建第一条记录。</p><button data-demo="done">创建记录</button>';if(n==='Grid'||n==='Layout')return '<div class="grid"><div class="region">入口一</div><div class="region">入口二</div><div class="region">入口三</div></div>';return `<div class="demo-row"><strong>${c.name}</strong><span class="label gray">示意区域</span></div><p>${c.description}</p><p class="small">完整交互和外观请在官方示例中查看。</p>`}
function component(c){let used=KB.patterns.filter(p=>p.components.includes(c.id));return `<div class="crumb">基础组件 / ${c.category}</div><span class="label gray">TDesign 目录映射</span><h1>${c.id} <span style="color:#7e8999">${c.name}</span></h1><p class="lead">${c.description}。组件能力、具体属性、事件和插槽以锁定版本的官方文档为准。</p><div class="tabs"><button class="active">交互示意</button></div><div class="preview"><div class="demo">${demo(c)}</div></div><p class="small">此处为 HTML 语义与交互示意，不是 TDesign 微信小程序组件的真实运行结果。</p><div class="actions" style="margin-top:20px"><a class="btn primary" href="${c.doc}" target="_blank" rel="noopener">打开官方组件文档</a></div><h2>在哪些模式中使用</h2>${used.length?`<div class="grid">${patternCards(used)}</div>`:'<div class="note">基础能力按实际需求选用，不要求每个组件必须归属某种模式。</div>'}<h2>可读元数据</h2><pre>${esc(JSON.stringify(c,null,2))}</pre>`}
function contract(){return `<span class="label">MODULE CONTRACT</span><h1>SPEC 输出契约</h1><p class="lead">模块读取提示词和项目约束，输出可传给下一阶段的 UI / 交互.md。这里定义稳定章节，暂不接入模型或冒充自动生成服务。</p><h2>输入至少包含</h2><div class="note">用户目标、核心对象、已有能力、目标平台、TDesign 锁定版本、主题约束。提示词未覆盖的信息，记录为假设或待确认项。</div><h2>输出应包含</h2><pre>${esc(specTemplate())}</pre><h2>结构决策顺序</h2><ol><li>提取用户任务与主要对象。</li><li>按页面或阶段选择主模式，必要时组合辅助模式。</li><li>根据选择条件决定布局变体，允许偏离但写明原因。</li><li>把语义区域映射到 TDesign 组件，标记业务封装与平台能力。</li><li>补充状态、布局行为和检查项，输出文档。</li></ol><button class="btn primary" id="template-download">下载输出模板</button>`}
function specTemplate(){return '# UI / 交互设计\n\n## 需求与假设\n用户目标、核心对象、已知条件、待确认项。\n\n## 页面与结构选择\n页面列表、主模式、辅助模式、布局变体及选择理由。\n\n## 页面区域\n按阅读顺序描述区域、内容字段、重要程度与出现条件。\n\n## 组件映射\nTDesign 组件名称、官方文档、项目版本、已验证配置。\n业务组合与平台能力单独声明。\n\n## 布局与视觉\n滚动、吸顶、固定、安全区、键盘适配；沿用默认主题或确认的覆盖项。\n\n## 交互与状态\n操作、跳转、输入校验、加载、空、失败、重试及结果未知。\n\n## 检查与未决项\n结构规则检查结果；需要真实渲染验证的项目；未确认的 API 与依赖。'}
function sources(){return `<h1>来源与版本边界</h1><div class="panel"><div class="kv"><h3>TDesign 官方组件</h3><p>基础组件目录来自官方概览。本页提炼的是组件使用意图，未复制完整 API。具体属性和能力随项目锁定版本核对。</p><a href="${KB.official_sources[0]}" target="_blank" rel="noopener">TDesign 小程序组件概览</a> · <a href="${KB.official_sources[1]}" target="_blank" rel="noopener">官方源码仓库</a></div><div class="kv"><h3>页面组织模式</h3><p>八类、二十四个变体与通用规则为项目建议，来自当前设计讨论。不是官方分类，也不要求覆盖所有需求。</p></div><div class="kv"><h3>展示方式参考</h3><p>参考链接页面标注为 CopilotKit 的 A2UI Playground，借鉴目录、组件详情与结构示例的呈现方式；本页未实现 A2UI 协议或接入其运行时。</p><a href="${KB.reference}" target="_blank" rel="noopener">查看参考页面</a></div><div class="kv"><h3>待确认</h3><p>实际 TDesign 依赖版本、主题 token、Chat 扩展范围、原生平台能力和业务组件白名单。未确认前不输出未经核验的组件 API。</p></div><div class="kv"><h3>当前实现</h3><p>纯 HTML / CSS / JavaScript，内嵌结构化知识数据；搜索、页面切换、结构预览和导出均在本地完成。没有服务端，没有模型调用，不会上传选择的本地文件。</p></div></div>`}
function render(){nav();let body='';if(query){let q=query.toLowerCase(),ps=KB.patterns.filter(p=>JSON.stringify(p).toLowerCase().includes(q)),cs=KB.components.filter(c=>[c.id,c.name,c.description,c.category].join(' ').toLowerCase().includes(q)),rs=KB.global_rules.filter(r=>JSON.stringify(r).toLowerCase().includes(q));body=`<h1>搜索结果</h1><p class="small">${ps.length} 个模式 · ${cs.length} 个组件 · ${rs.length} 条规则</p>${ps.length?'<h2>页面模式</h2><div class="grid">'+patternCards(ps)+'</div>':''}${cs.length?'<h2>基础组件</h2><div class="grid">'+compCards(cs)+'</div>':''}${rs.map(r=>`<div class="note"><b>${r.title}</b><p>${r.rule}</p></div>`).join('')}${!ps.length&&!cs.length&&!rs.length?'<div class="note">没有匹配内容，请换一个关键词。</div>':''}`;}else if(route==='overview')body=overview();else if(route.startsWith('pattern:')){let p=KB.patterns.find(p=>p.id===route.split(':')[1]);body=p?pattern(p):overview()}else if(route.startsWith('component:')){let c=KB.components.find(c=>c.id===route.split(':')[1]);body=c?component(c):overview()}else if(route.startsWith('components')){let g=route.split(':')[1];body=`<div class="crumb">TDesign / 基础组件</div><h1>${g||'组件目录'}</h1><p class="lead">官方组件是基础能力；业务模块通过组合实现。点击查看使用意图、相关模式和官方文档。</p><div class="note">目录已对照官方概览，API 不在本页重写。文档链接与项目采用版本需在接入时最终核对。</div><div class="grid">${compCards(KB.components.filter(c=>!g||c.category===g))}</div>`}else if(route==='rules')body=`<h1>通用设计规则</h1><p class="lead">条件优先于固定模板，任务优先于类型归属。</p>${KB.global_rules.map(r=>`<div class="panel" style="margin:14px 0"><span class="ruleid">${r.id}</span><h2 style="margin:6px 0 10px">${r.title}</h2><p>${r.rule}</p></div>`).join('')}`;else if(route==='contract')body=contract();else body=sources();$('#main').innerHTML=body+'<footer>设计知识库 v0.3 · 审阅稿 · TDesign 目录与项目组合规则分层记录 · 仅本地预览，尚未部署</footer>';bind()}
function download(name,text,type='text/plain'){let u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2500)}
function markdown(){return '# 小程序设计知识库\n\n版本：'+KB.version+'；状态：审阅稿；TDesign 版本：待确认。\n\n## 基础约束\n\n'+KB.global_rules.map(r=>'### '+r.id+' '+r.title+'\n'+r.rule).join('\n\n')+'\n\n## 页面组织模式\n\n'+KB.patterns.map(p=>'### '+p.name+'\n选择条件：'+p.select_when+'\n组织原则：'+p.principle+'\n\n'+p.variants.map(v=>'- '+v.name+'：'+v.when+'；结构：'+v.regions.join(' → ')).join('\n')+'\n\n组件：'+p.components.join('、')+'\n\n组合规则：\n'+p.rules.map(r=>'- '+r).join('\n')+'\n\n检查项：\n'+p.checks.map(r=>'- '+r).join('\n')+'\n\n业务边界：'+p.extension).join('\n\n')+'\n\n## 组件目录\n\n'+KB.components.map(c=>'- ['+c.id+' '+c.name+']('+c.doc+')：'+c.description).join('\n')+'\n\n## 输出模板\n\n'+specTemplate()}
function bind(){document.querySelectorAll('[data-route]').forEach(e=>e.onclick=()=>{query='';$('#search').value='';go(e.dataset.route)});document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{tab=e.dataset.tab;render()});if($('#variant'))$('#variant').onchange=e=>{variant=+e.target.value;render()};if($('#download-pattern'))$('#download-pattern').onclick=()=>download(route.split(':')[1]+'.json',JSON.stringify(KB.patterns.find(p=>p.id===route.split(':')[1]),null,2),'application/json');if($('#template-download'))$('#template-download').onclick=()=>download('ui-interaction-template.md',specTemplate());document.querySelectorAll('[data-demo]').forEach(e=>e.onclick=()=>{if($('#demo-status'))$('#demo-status').textContent='当前：'+(e.dataset.demo==='first'?'第一个视图':'第二个视图');else toast(e.dataset.demo==='feedback'?'反馈交互示意，完整组件请查看官方文档':e.dataset.demo==='cancel'?'已选择次要操作':'操作已响应（本地示意）')});if($('#range'))$('#range').oninput=e=>{$('#range-value').textContent=e.target.value;$('#range-bar').style.width=e.target.value+'%'};if($('#local-file'))$('#local-file').onchange=e=>$('#file-status').textContent=e.target.files[0]?.name||'尚未选择文件'}
$('#search').oninput=e=>{query=e.target.value.trim();render()};$('#export-json').onclick=()=>download('miniapp-design-knowledge.json',JSON.stringify(KB,null,2),'application/json');$('#export-md').onclick=()=>download('miniapp-design-rules.md',markdown());window.addEventListener('hashchange',()=>{let r=decodeURIComponent(location.hash.slice(1));if(r!==route){route=r;variant=0;tab='preview';render()}});if(location.hash)route=decodeURIComponent(location.hash.slice(1));render();
</script></body></html>
